<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>TV</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/food-time.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/quiz-tv.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/matching-tv.js') }}" defer></script>
</head>
<body class="tv">
  <img id="food-time-image" src="{{ url_for('static', filename='images/food-time.png') }}"
       alt="" draggable="false"{% if not food_time %} hidden{% endif %}>
  <video id="tv-video" playsinline disablepictureinpicture disableremoteplayback
         controlslist="nodownload nofullscreen noremoteplayback" tabindex="-1" hidden></video>
  <div id="video-overlay" hidden>
    <span id="video-loading" hidden>Loading...</span>
    <span id="video-countdown"></span>
    <progress id="playlist-progress" max="1" value="0" aria-label="Playlist progress"></progress>
  </div>
  <img id="screen-time-ended" src="{{ url_for('static', filename='images/screen-time-ended.jpg') }}"
       alt="" draggable="false" hidden>
  <section id="quiz-home" hidden>
    <button id="quiz-launcher" class="quiz-tile" type="button" aria-label="Quiz">
      <img src="{{ url_for('static', filename='images/quiz-mascot.svg') }}" alt=""><span>Quiz</span>
    </button>
    <button id="matching-launcher" class="quiz-tile" type="button" aria-label="Card match">
      <img src="{{ url_for('static', filename='images/matching-mascot.svg') }}" alt=""><span>Card match</span>
    </button>
    <p id="home-game-error" role="alert"></p>
  </section>
  <section id="quiz-screen" hidden>
    <button id="quiz-close" type="button" aria-label="Close quiz">X</button>
    <div id="quiz-menu" hidden><h1>Let's play!</h1><div id="quiz-categories"></div></div>
    <div id="quiz-slide" hidden>
      <span id="quiz-round-count"></span>
      <div id="quiz-picture-frame"><img id="quiz-picture" alt="" draggable="false"></div>
      <p id="quiz-answer" hidden></p>
      <div id="quiz-clock"><progress id="quiz-time-progress" max="1" value="1"></progress><span id="quiz-seconds"></span></div>
      <div id="quiz-loader" hidden><span class="quiz-spinner"></span><span>Getting ready...</span></div>
    </div>
    <div id="quiz-complete" hidden><span aria-hidden="true">&#9733;</span><h1>Lovely playing!</h1><p>Let's play together.</p></div>
    <p id="quiz-tv-error" role="alert"></p>
  </section>
  <section id="matching-screen" hidden>
    <button id="matching-close" class="game-close" type="button" aria-label="Close card match">X</button>
    <h1 id="matching-title">Find the pair!</h1>
    <p id="matching-round"></p>
    <div id="matching-board" aria-label="Matching cards"></div>
    <p id="matching-message" role="status"></p>
    <button id="matching-again" type="button" hidden>Play again</button>
    <p id="matching-error" role="alert"></p>
  </section>
</body>
</html>
