<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>TV</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/food-time.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/quiz-tv.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/matching-tv.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/typing-tv.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/adventures-tv.js') }}" defer></script>
</head>
<body class="tv">
  <div id="digital-clock" hidden><time id="digital-clock-time" aria-label="Current time"></time></div>
  <img id="food-time-image" src="{{ url_for('static', filename='images/food-time.png') }}"
       alt="" draggable="false"{% if not food_time %} hidden{% endif %}>
  <video id="tv-video" playsinline disablepictureinpicture disableremoteplayback
         controlslist="nodownload nofullscreen noremoteplayback" tabindex="-1" hidden></video>
  <div id="video-overlay" hidden>
    <span id="video-loading" hidden>Loading...</span>
    <span id="video-countdown"></span>
    <progress id="playlist-progress" max="1" value="0" aria-label="Playlist progress"></progress>
  </div>
  <img id="screen-time-ended" src="{{ url_for('static', filename='images/screen-time-ended.jpg') }}"
       alt="" draggable="false" hidden>
  <section id="quiz-home" hidden>
    <button id="quiz-launcher" class="quiz-tile" type="button" aria-label="Quiz">
      <img src="{{ url_for('static', filename='images/quiz-mascot.svg') }}" alt=""><span>Quiz</span>
    </button>
    <button id="matching-launcher" class="quiz-tile" type="button" aria-label="Card match">
      <img src="{{ url_for('static', filename='images/matching-mascot.svg') }}" alt=""><span>Card match</span>
    </button>
    <p id="home-game-error" role="alert"></p>
    <button id="typing-launcher" class="quiz-tile" type="button" aria-label="Hero Typing">
      <img src="{{ url_for('static', filename='images/typing-logo.png') }}" alt=""><span>Hero Typing</span>
    </button>
    <button id="adventure-launcher" class="quiz-tile" type="button" aria-label="Adventure games">
      <img src="{{ url_for('static', filename='images/adventure-adventure.svg') }}" alt=""><span>Adventure games</span>
    </button>
  </section>
  <section id="quiz-screen" hidden>
    <button id="quiz-close" type="button" aria-label="Close quiz">X</button>
    <div id="quiz-menu" hidden><h1>Let's play!</h1><div id="quiz-categories"></div></div>
    <div id="quiz-slide" hidden>
      <span id="quiz-round-count"></span>
      <div id="quiz-picture-frame"><img id="quiz-picture" alt="" draggable="false"></div>
      <p id="quiz-answer" hidden></p>
      <div id="quiz-clock"><progress id="quiz-time-progress" max="1" value="1"></progress><span id="quiz-seconds"></span></div>
      <div id="quiz-loader" hidden><span class="quiz-spinner"></span><span>Getting ready...</span></div>
    </div>
    <div id="quiz-complete" hidden><span aria-hidden="true">&#9733;</span><h1>Lovely playing!</h1><p>Let's play together.</p></div>
    <p id="quiz-tv-error" role="alert"></p>
  </section>
  <section id="matching-screen" hidden>
    <button id="matching-close" class="game-close" type="button" aria-label="Close card match">X</button>
    <h1 id="matching-title">Find the pair!</h1>
    <p id="matching-round"></p>
    <div id="matching-board" aria-label="Matching cards"></div>
    <p id="matching-message" role="status"></p>
    <button id="matching-again" type="button" hidden>Play again</button>
    <p id="matching-error" role="alert"></p>
  </section>
  <section id="typing-screen" hidden>
    <button id="typing-close" class="game-close" type="button" aria-label="Close Hero Typing">X</button>
    <div id="typing-menu">
      <h1>Hero Typing <small>Level 1</small></h1>
      <p>Pick a name. Let's help our heroes!</p>
      <div class="button-row typing-tabs">
        <button id="typing-heroes-tab" type="button" aria-pressed="true">Heroes &amp; friends</button>
        <button id="typing-words-tab" type="button" aria-pressed="false">Everyday words</button>
      </div>
      <p class="typing-art-note">Pick a favourite character or an everyday picture.</p>
      <div id="typing-choices"></div>
    </div>
    <div id="typing-play" hidden>
      <div id="typing-character"><img id="typing-picture" alt=""><span id="typing-character-name"></span></div>
      <div id="typing-practice">
        <h1>Level 1 <span>Hero Typing</span></h1>
        <div id="typing-letters" aria-label="Name to type"></div>
        <p id="typing-hint" role="status"></p>
        <div id="typing-keyboard" aria-label="Letter keys"></div>
        <div class="button-row typing-actions">
          <button id="typing-listen" type="button">Hear again</button>
          <button id="typing-choose" type="button">Choose a name</button>
        </div>
        <p id="typing-celebration" hidden>You did it!</p>
      </div>
      <button id="typing-previous" class="typing-arrow" type="button" aria-label="Previous character"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M38 12 18 32l20 20M19 32h34"/></svg></button>
      <button id="typing-next" class="typing-arrow" type="button" aria-label="Next character"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="m26 12 20 20-20 20M45 32H11"/></svg></button>
    </div>
    <p id="typing-error" role="alert"></p>
  </section>
  <section id="adventure-screen" hidden>
    <button id="adventure-close" class="game-close" type="button" aria-label="Close adventures">X</button>
    <div id="adventure-menu">
      <h1>Let's go on an adventure!</h1>
      <div id="adventure-games"></div>
      <p id="adventure-menu-message" role="status"></p>
    </div>
    <div id="adventure-play" hidden>
      <h1 id="adventure-title"></h1>
      <p id="adventure-prompt" role="status"></p>
      <div id="adventure-scene"></div>
      <div id="adventure-choices"></div>
      <div class="button-row adventure-actions">
        <button id="adventure-hear" type="button">Hear again</button>
        <button id="adventure-ready" type="button" hidden>Ready to pack!</button>
        <button id="adventure-next" type="button" hidden>Next adventure</button>
        <button id="adventure-again" type="button" hidden>Play again</button>
        <button id="adventure-choose" type="button">Choose a game</button>
      </div>
    </div>
    <p id="adventure-error" role="alert"></p>
  </section>
</body>
</html>
