<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Parent</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/parent.js') }}" defer></script>
</head>
<body class="parent">
  <main>
    {% if authenticated %}
    <p>Signed in.</p>
    <button id="logout" type="button">Sign out</button>
    {% else %}
    <h1>{{ 'Parent login' if configured else 'Set parent PIN' }}</h1>
    <form id="login" data-endpoint="{{ '/api/login' if configured else '/api/setup' }}">
      <label for="pin">PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{6,12}"
             minlength="6" maxlength="12" autocomplete="{{ 'current-password' if configured else 'new-password' }}" required>
      <button type="submit">{{ 'Sign in' if configured else 'Set PIN' }}</button>
    </form>
    {% endif %}
    <p id="error" role="alert"></p>
  </main>
</body>
</html>
