[project]
name = "kid-learning-tv"
version = "1.0.0"
description = "Offline-first learning and games appliance for a child-friendly TV"
requires-python = ">=3.10"
dependencies = [
  "Flask==3.1.2",
  "jsonschema==4.25.1",
  "qrcode==8.2",
  "waitress==3.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
