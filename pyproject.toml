[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kid-learning-tv"
version = "1.0.0"
description = "Blank TV display with parent PIN login"
requires-python = ">=3.10"
dependencies = [
  "Flask==3.1.2",
  "waitress==3.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.setuptools.package-data]
app = ["templates/*.html", "static/css/*.css", "static/js/*.js", "static/images/*.svg", "static/characters/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
