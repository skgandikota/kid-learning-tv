[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kid-learning-tv"
version = "1.0.0"
description = "Parent-controlled TV with Food time, video playlists and picture quizzes"
requires-python = ">=3.10"
dependencies = [
  "Flask==3.1.2",
  "waitress==3.0.2",
  "yt-dlp[default]==2026.10.21",
  "deno==2.9.8",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
quiz-voice = ["piper-tts==1.8.0", "huggingface-hub==0.36.0"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.setuptools.package-data]
app = ["templates/*.html", "static/css/*.css", "static/js/*.js", "static/images/*.png", "static/images/*.jpg", "static/images/*.svg", "static/quiz/catalog.json", "static/quiz/ATTRIBUTION.txt", "static/quiz/*/*.svg", "static/quiz/licenses/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
